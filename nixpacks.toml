# Configuração para o sistema de build Nixpacks do Railway

[phases.setup]
# Lista de pacotes do sistema (Debian/Ubuntu) que o Puppeteer/Chromium necessita
aptPkgs = [
    "ca-certificates",
    "fonts-liberation",
    "libappindicator3-1",
    "libasound2",
    "libatk-bridge2.0-0",
    "libatk1.0-0",
    "libcairo2",
    "libcups2",
    "libdbus-1-3",
    "libexpat1",
    "libfontconfig1",
    "libgbm1",
    "libgcc1",
    "libglib2.0-0",
    "libgobject-2.0-0", # A biblioteca específica que estava em falta
    "libgtk-3-0",
    "libnspr4",
    "libnss3",
    "libpango-1.0-0",
    "libpangocairo-1.0-0",
    "libstdc++6",
    "libx11-6",
    "libx11-xcb1",
    "libxcb1",
    "libxcomposite1",
    "libxcursor1",
    "libxdamage1",
    "libxext6",
    "libxfixes3",
    "libxi6",
    "libxrandr2",
    "libxrender1",
    "libxss1",
    "libxtst6",
    "lsb-release",
    "wget",
    "xdg-utils"
]

[start]
# O comando para iniciar a sua aplicação
cmd = "node botzdg.js"
